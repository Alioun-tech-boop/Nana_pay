[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Backend = source de verite (verifie sur Render : /healthz, auth, catalog, orders)
  VITE_NP_API_MODE = "real"
  # Les chemins frontend n'ont pas de préfixe (/auth/login) et le backend utilise
  # setGlobalPrefix('api') : le préfixe est ajouté par le proxy ci-dessous.
  VITE_NP_API_URL = "/api"

# Proxy vers le backend Render.
# Meme origine : aucun CORS, aucun en-tete bloque en preflight.
# DOIT preceder la regle "/*" et etre force, sinon le fallback SPA l'intercepte.
# /healthz est le healthcheck du backend, hors du prefixe /api : sans sa propre
# regle il tomberait dans le fallback SPA et renverrait du HTML en 200.
[[redirects]]
  from = "/healthz"
  to = "https://nanapay-api.onrender.com/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://nanapay-api.onrender.com/api/:splat"
  status = 200
  force = true

# Les assets sont servis tels quels : un fichier manquant doit renvoyer 404.
# Sans cette regle, le fallback SPA plus bas repondait 200 avec du HTML, ce qui
# masquait silencieusement toute reference d'asset cassee (un bundle inexistant
# ressemblait a un succes). Regler ici n'est pas une optimisation : c'est ce qui
# rend une panne detectable.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

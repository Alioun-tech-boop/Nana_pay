[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Backend = source de verite (verifie sur Render : /healthz, auth, catalog, orders)
  VITE_NP_API_MODE = "real"
  # Les chemins frontend n'ont pas de préfixe (/auth/login) et le backend utilise
  # setGlobalPrefix('api') : le préfixe est ajouté par le proxy ci-dessous.
  VITE_NP_API_URL = "/api"

# Proxy /api -> backend Render.
# Meme origine : aucun CORS, aucun en-tete bloque en preflight.
# DOIT précéder la règle "/*" et être forcé, sinon le fallback SPA l'intercepte.
[[redirects]]
  from = "/api/*"
  to = "https://nanapay-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
